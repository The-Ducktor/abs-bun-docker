name: Build Bun image on upstream release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(curl -s https://api.github.com/repos/advplyr/audiobookshelf/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Skip if already built
        id: check
        run: |
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user/packages/container/${{ github.event.repository.name }}/versions" 2>/dev/null || echo "000")
          echo "skip=false" >> "$GITHUB_OUTPUT"  # replace with real check if you want to be strict

      - name: Checkout this repo (for Dockerfile.bun)
        uses: actions/checkout@v4
        with:
          path: build-config

      - name: Checkout upstream at release tag
        uses: actions/checkout@v4
        with:
          repository: advplyr/audiobookshelf
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream

      - name: Place custom Dockerfile into upstream source
        run: cp build-config/Dockerfile.bun upstream/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.upstream.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest
