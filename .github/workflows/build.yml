name: Build Bun image on upstream release

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Get latest upstream release tag
        id: upstream
        run: |
          TAG=$(curl -s https://api.github.com/repos/advplyr/audiobookshelf/releases/latest | jq -r .tag_name)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Lowercase repository name
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Checkout this repo (for Dockerfile.bun)
        uses: actions/checkout@v7
        with:
          path: build-config

      - name: Checkout upstream at release tag
        uses: actions/checkout@v7
        with:
          repository: advplyr/audiobookshelf
          ref: ${{ steps.upstream.outputs.tag }}
          path: upstream

      - name: Place custom Dockerfile into upstream source
        run: cp build-config/Dockerfile.bun upstream/Dockerfile

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./upstream
          file: ./upstream/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.upstream.outputs.tag }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
